name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  frontend:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Angular SPA
        run: npm run build
      - name: Run Angular unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

  backend:
    name: IRIS image + ObjectScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the IRIS image
        run: docker compose build
      - name: Start IRIS
        run: docker compose up -d
      - name: Wait for IRIS to be ready
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T iris iris session IRIS -U %SYS 'Write 1,!' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "IRIS did not become ready in time" >&2
          exit 1
      - name: Run %UnitTest.Manager suites
        run: docker compose exec -T iris iris session IRIS -U MANAGEMENT 'do ##class(%UnitTest.Manager).RunTest("/opt/mgmt/dev/tests")'
      - name: Tear down
        run: docker compose down