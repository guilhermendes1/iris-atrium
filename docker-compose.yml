services:
  iris:
    build:
      context: .
    image: iris-atrium:latest
    container_name: iris-atrium-iris
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/iris-entrypoint.sh"]
    command: --check-caps false
    environment:
      MP_MAX_CORES: "19"
    ports:
      - "52773:52773"
    volumes:
      - ./:/opt/mgmt/dev
    healthcheck:
      test: ["CMD", "iris", "session", "IRIS", "-U", "%SYS", "Write 1,!"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s